name: Scraper Alertas Viales v2
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      ventana_horas:
        description: 'Ventana rodante en horas (default 3)'
        required: false
        default: '3'
      run_mode:
        description: 'Modo: all | official_only | media_only'
        required: false
        default: 'all'

concurrency:
  group: alertas-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Código ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python ────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Caché de dependencias ──────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-requests-feedparser-bs4-lxml

      # ── 4. Dependencias ──────────────────────────────────────────
      - name: Instalar dependencias
        run: |
          pip install --quiet \
            requests==2.31.0 \
            feedparser==6.0.11 \
            beautifulsoup4==4.12.3 \
            lxml==5.2.1

      # ── 5. Ejecutar scraper ───────────────────────────────────────
      - name: Ejecutar scraper
        env:
          LOOKBACK_HORAS: ${{ github.event.inputs.ventana_horas || '3' }}
          RUN_MODE:       ${{ github.event.inputs.run_mode      || 'all' }}
        run: python scraper/main.py

      # ── 6. Validar JSON ───────────────────────────────────────────
      - name: Validar alertas.json
        run: |
          python - <<'EOF'
          import json, sys
          try:
              with open("alertas.json") as f:
                  d = json.load(f)
              total = d.get("total", 0)
              mapa  = len(d.get("para_mapa", []))
              print(f"✅  JSON válido · {total} alertas · {mapa} con coordenadas")
              print(f"    Ventana: {d.get('ventana', 'n/d')}")
              print(f"    Fuentes: {', '.join(d.get('fuentes', []))}")
          except Exception as e:
              print(f"❌  JSON inválido: {e}")
              sys.exit(1)
          EOF

      # ── 7. Subir artefacto (diagnóstico) ─────────────────────────
      - name: Subir alertas.json como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: alertas-${{ github.run_number }}
          path: alertas.json
          retention-days: 3

      # ── 8. Commit + Push con reintentos ──────────────────────────
      - name: Commit alertas.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add alertas.json
          git diff --cached --quiet && echo "Sin cambios en alertas.json" && exit 0

          TOTAL=$(python -c "import json; d=json.load(open('alertas.json')); print(d.get('total',0))")
          VENTANA=$(python -c "import json; d=json.load(open('alertas.json')); print(d.get('ventana','24h'))")
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          git commit -m "bot: alertas.json · ${TOTAL} alertas · ${VENTANA} · ${TIMESTAMP} [skip ci]"

          PUSH_OK=0
          for i in 1 2 3; do
            git push && echo "✅ Push exitoso (intento $i)" && PUSH_OK=1 && break
            echo "⚠️  Intento $i falló — reintentando…"
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          [ "$PUSH_OK" -eq 1 ] || { echo "❌ Push falló en los 3 intentos"; exit 1; }
