name: 🚨 Alertas Viales — Scraper Automático

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: ⬇️  Checkout
        uses: actions/checkout@v4
        with:
          # Traer siempre el commit más reciente del repo
          ref: main
          fetch-depth: 0

      - name: 🐍  Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: 📦  Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: 🔍  Ejecutar scraper
        run: python scraper/main.py

      - name: 💾  Commit alertas.json
        run: |
          git config user.email "bot@alertas-viales.io"
          git config user.name  "AlertasVialesBot"

          # Sincronizar con el remoto ANTES de commitear
          git fetch origin main
          git rebase origin/main

          git add alertas.json

          # Si no hubo cambios reales, salir sin error
          git diff --staged --quiet && exit 0

          git commit -m "🔄 Alertas: $(date -u '+%d-%b-%Y %H:%M UTC')"
          git push
