name: 🚨 Alertas Viales — Scraper Automático

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# ── Un solo run a la vez — el siguiente espera al anterior ───────
concurrency:
  group: alertas-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: ⬇️  Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍  Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: 📦  Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: 🔍  Ejecutar scraper
        run: python scraper/main.py

      - name: 💾  Commit alertas.json
        run: |
          git config user.email "bot@alertas-viales.io"
          git config user.name  "AlertasVialesBot"

          git add alertas.json
          git diff --staged --quiet && exit 0

          git commit -m "🔄 Alertas: $(date -u '+%d-%b-%Y %H:%M UTC')"

          # Reintentar push hasta 3 veces (por si el remoto cambió)
          for i in 1 2 3; do
            git push && echo "✅ Push exitoso en intento $i" && break
            echo "⚠️  Intento $i falló — jalando cambios y reintentando..."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
