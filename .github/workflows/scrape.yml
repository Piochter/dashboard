name: 🚨 Alertas Viales — Scraper Automático
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Modo de fuentes"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - official_only
          - media_only
      lookback_minutes:
        description: "Ventana de búsqueda en minutos"
        required: false
        default: "30"
        type: string
      accept_undated:
        description: "Aceptar fuentes sin fecha publicada"
        required: false
        default: true
        type: boolean

concurrency:
  group: alertas-scraper
  cancel-in-progress: false

permissions:
  contents: write

env:
  SCRAPER_RUN_MODE:               ${{ github.event.inputs.run_mode || 'all' }}
  SCRAPER_LOOKBACK_MINUTES: ${{ github.event.inputs.lookback_minutes || '180' }}
  SCRAPER_OUTPUT_FILE:            alertas.json
  SCRAPER_DEDUPE_WINDOW_HOURS:    "4"
  SCRAPER_DEDUPE_KM_TOLERANCE:    "5"
  SCRAPER_OFFICIAL_MIN_CONFIDENCE: "0.85"
  SCRAPER_PROBABLE_MIN_CONFIDENCE: "0.60"
  SCRAPER_ACCEPT_UNDATED:         ${{ github.event.inputs.accept_undated || 'true' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: 🔍 Ejecutar scraper
        env:
          TWITTER_BEARER_TOKEN:     ${{ secrets.TWITTER_BEARER_TOKEN }}
          TELEGRAM_API_ID:          ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:        ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING:  ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: python scraper/main.py

      - name: ✅ Validar alertas.json
        run: |
          python -m json.tool "$SCRAPER_OUTPUT_FILE" > /tmp/alertas.validado.json
          echo "JSON válido: $SCRAPER_OUTPUT_FILE"

      - name: 📎 Subir diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alertas-viales-output
          path: alertas.json
          retention-days: 7

      - name: 💾 Commit alertas.json
        run: |
          git config user.email "bot@alertas-viales.io"
          git config user.name  "AlertasVialesBot"

          git add "$SCRAPER_OUTPUT_FILE"
          git diff --staged --quiet && echo "Sin cambios en alertas.json" && exit 0

          git commit -m "🔄 Alertas: $(date -u '+%d-%b-%Y %H:%M UTC')"

          PUSH_OK=0
          for i in 1 2 3; do
            git push && echo "✅ Push exitoso en intento $i" && PUSH_OK=1 && break
            echo "⚠️ Intento $i falló — jalando cambios y reintentando..."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          [ "$PUSH_OK" -eq 1 ] || { echo "❌ Push falló en los 3 intentos"; exit 1; }
